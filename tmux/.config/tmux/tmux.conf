unbind C-b
set -g prefix F12
bind F12 send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 0

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file $HOME/.config/tmux/tmux.conf

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-style "bg=default"
set -g status-right-length 120
set -g status-left ""
set -g status-right '#[fg=#74c7ec]#(cd #{q:pane_current_path} && git rev-parse --abbrev-ref HEAD | sed -E "s/^(.{12}).{9,}(.{12})$/\1…\2/") #[fg=#6c7086]%H:%M'
set -g status-interval 5

setw -g window-status-format "#[fg=#6c7086]#I"
setw -g window-status-current-format "#[fg=#74c7ec]#I"
setw -g window-status-separator " "

set -g popup-border-lines rounded
set -g popup-border-style "fg=#89b4fa"

bind g popup -B -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind f popup -w 60% -h 30% -E 'bash "$HOME/.config/tmux/sessionizer.sh" #{q:client_name}'
bind Space popup -d "#{pane_current_path}" \
    -x '#{e|+:#{pane_left},#{cursor_x}}' \
    -y '#{?#{e|>=:#{e|+:#{pane_top},#{cursor_y}},#{popup_height}},#{e|+:#{pane_top},#{cursor_y}},#{e|+:#{e|+:#{pane_top},#{cursor_y}},#{e|+:#{popup_height},1}}}' \
    -w 35% -h 25% -EE 'bash "$HOME/.config/tmux/file-picker.sh" #{q:pane_id} #{q:pane_current_path}'
bind u popup -w 60% -h 60% -EE 'bash "$HOME/.config/tmux/urls.sh" #{q:pane_id}'
bind w popup -w 90% -h 90% -EE 'bash "$HOME/.config/tmux/wallpaper.sh" #{q:client_name}'
