# each worktree opens as a seperate session as opposed to windows
mode: session
# don't add agent icons to tmux windows
status_format: false
# enable nerd fonts, duh
nerdfont: true

window_prefix: "{project} 󰘬 "

# default window layout
windows:
  - name: editor
    panes:
      - command: nvim
        focus: true
  - name: server
  - name: agent
